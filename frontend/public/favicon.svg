<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#09090b"/>
  <!-- Central Nucleus -->
  <circle cx="32" cy="32" r="4.5" fill="#ffffff"/>
  <!-- Orbital Ring 1 (Horizontal) -->
  <ellipse cx="32" cy="32" rx="22" ry="8.5" fill="none" stroke="#ffffff" stroke-width="2.5" />
  <!-- Orbital Ring 2 (Rotated 60deg) -->
  <ellipse cx="32" cy="32" rx="22" ry="8.5" fill="none" stroke="#ffffff" stroke-width="2.5" transform="rotate(60 32 32)" />
  <!-- Orbital Ring 3 (Rotated 120deg) -->
  <ellipse cx="32" cy="32" rx="22" ry="8.5" fill="none" stroke="#ffffff" stroke-width="2.5" transform="rotate(120 32 32)" />
</svg>
